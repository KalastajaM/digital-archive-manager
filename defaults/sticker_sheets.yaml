# Built-in sticker sheet layouts (mm). A saved custom layout lives in the config folder's
# sticker_sheets.yaml with the id "custom"; the built-ins are always read from here.
# The L7651 values follow Avery's template; check them against the pack you buy.
- id: l7651
  name: Avery Zweckform L7651 (65 per sheet, 38.1 x 21.2 mm)
  columns: 5
  rows: 13
  label_w_mm: 38.1
  label_h_mm: 21.2
  top_mm: 10.7
  left_mm: 4.7
  gap_x_mm: 2.5
  gap_y_mm: 0
  cut_lines: false
- id: plain
  name: Plain paper, cut out
  columns: 5
  rows: 13
  label_w_mm: 38.1
  label_h_mm: 21.2
  top_mm: 10.7
  left_mm: 4.7
  gap_x_mm: 2.5
  gap_y_mm: 0
  cut_lines: true
