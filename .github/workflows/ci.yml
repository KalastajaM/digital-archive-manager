name: CI

on:
  # every PR, and main after a merge; a push to a PR branch is covered by its PR
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the run that is still going; runs on main finish.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts a PR touches. A frontend-only PR skips the backend jobs and vice versa;
  # the workflow file itself counts for both. On main everything runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'push' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'push' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'defaults/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'docs/**'  # Help.tsx bundles docs/guide.md; Help.test.tsx reads reference.md
              - '.github/workflows/ci.yml'

  backend:
    name: backend (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"  # as .python-version; the runner's own Python may be newer
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fin
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q -W error

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  # The generated API types must match the backend's OpenAPI schema (npm run gen:api,
  # which uses a throwaway data dir and an empty archive folder).
  schema:
    name: api schema up to date
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run gen:api
        working-directory: frontend
      - name: Fail when schema.d.ts is stale
        run: git diff --exit-code -- frontend/src/api/schema.d.ts

  # One check to require in branch protection: it passes when every job that ran passed
  # (skipped ones count as passed), so a PR that skips a part never waits for it.
  ci-ok:
    name: CI ok
    needs: [changes, backend, frontend, schema]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks that ran passed
        run: |
          echo "changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} schema=${{ needs.schema.result }}"
          for r in "${{ needs.changes.result }}" "${{ needs.backend.result }}" "${{ needs.frontend.result }}" "${{ needs.schema.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then exit 1; fi
          done
