name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'backend/uv.lock'
      - 'backend/pyproject.toml'
      - 'frontend/package-lock.json'
      - 'frontend/package.json'
      - '.github/workflows/audit.yml'
  schedule:
    - cron: '17 5 * * 1'  # weekly, Monday morning UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: pip-audit (locked backend dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
      - name: Audit the runtime dependencies in uv.lock
        working-directory: backend
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-dev --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  npm:
    name: npm audit (runtime dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - run: npm audit --audit-level=high --omit=dev
        working-directory: frontend
