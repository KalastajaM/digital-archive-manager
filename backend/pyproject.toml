[project]
name = "dam"
version = "0.1.0"
description = "Digital Archive Manager"
requires-python = ">=3.13"
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic",
    "pydantic>=2",
    "PyYAML",
    "typer",
    "fastapi",
    "uvicorn",
    "watchdog",
    "pypdfium2",
    "ocrmac; sys_platform == 'darwin'",
    "platformdirs",
    "pytesseract",
    "python-docx",
    "xattr; sys_platform != 'win32'",
    "tzdata; sys_platform == 'win32'",  # zoneinfo has no system database on Windows
    "pillow",
    "regex>=2026.9.29",
    "keyring",
    "zxing-cpp==3.1.1",
    "anthropic==1.16.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
# .msg (Outlook) e-mails; extract-msg is GPL, so it is not part of the core install
msg = ["extract-msg"]

[dependency-groups]
dev = [
    "extract-msg",
    "pytest",
    "ruff",
    "httpx2>=2.14.0",
    "xlwt>=1.3.0",
]

[project.scripts]
dam = "dam.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dam"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: needs an OCR engine (Apple Vision on macOS, or Tesseract)"]
